<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열</title>
</head>
<body>
    <h1>배열</h1>
    <h6>검사>console 확인</h6>
    <br>
    <p>하나의 변수에 여러 값을 저장하는 자료형</p>
    <script>
        // const arr = [여러 값]
        const arr = [1, 2, 3, 4, 5];
        console.log(arr);
        console.log(typeof arr); // object(객체)
        console.log(Array.isArray(arr)); // 배열인지? true / false
        console.log(arr[2]) // 값만 나옴 - 인덱스는 0부터 시작
        console.log(arr.length); // 배열의 길이 

        // 배열의 마지막 값
         console.log(arr[arr.length - 1]);
    </script>

    <h2>배열 요소 추가</h2>
    <script>
        arr.push(6); // 맨 뒤에 추가
        arr.unshift(0); // 맨 앞에 추가
        // splice(인덴스, 삭제할개수 , 추가할 값1, ···)
        arr.splice(3, 0, 9, 2);
        console.log(arr);
    </script>

    <h2>배열 요소 삭제</h2>
    <script>
        arr.pop(); // 맨 뒤에 삭제
        arr.shift(); // 맨 앞에 삭제
        // 인덱스 2에 있는 값 하나 삭제
        arr.splice(2, 1);
        console.log(arr);
    </script>

    <h2>배열 요소 수정</h2>
    <script>
        // 기존 인덱스 값을 삭제하고 새로운 값을 추가
        arr.splice(1, 1, 100);
        console.log(arr);

        //값이 4인 걸 777로 수정
        //indexOf(값) -> 해당 값의 인덱스
        const index = arr.indexOf(4)
        arr.splice(index, 1, 777);
        console.log(arr);
        
        arr[index] = 999
        console.log(arr);
    </script>

    <h2>배열 정렬</h2>
    <script>
        arr.sort(); // 문자 정렬
        arr.sort((a, b) => a - b); // 숫자 정렬
        arr.reverse(); // 역순 정렬
        console.log(arr);
        </script>

        <h2>문자열 - 배열</h2>
        <script>
            const str = 'Hello, JavaScript!';
            // split(구분자) : 문자열 -> 배열
                 //split(구분자 - 잘라 주는 역할)
                    //  '공백' - h, e, l,··· 
                    //  ',' - Hello / JavaScript ,기준으로 
            const strToArr = str.split('');
            console.log(strToArr);

            

            // join(구분자) : 배열 -> 문자열
            const arrToStr = strToArr.join('.');
            console.log(arrToStr);
        </script>
</body>
</html>
