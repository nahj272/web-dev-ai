<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배열, 반복문 연습문제</title>
  </head>
  <body>
    <h1>배열, 반복문 연습문제</h1>
    <ol style="line-height: 2">
      <li>
        1부터 20까지의 합을 구하시오.
        <script>
          // 여기에 코드 작성

          let sum = 0;
          for(let i = 1; i <=20; i++) {
            sum += i; }
            // sum = sum + i
           console.log(sum);
        </script>
      </li>

      <li>
        주어진 배열의 모든 요소를 for문으로 순회하며 합계를 구하시오.
        <script>
          const price = [5500, 3000, 12000, 8000];
          // 여기에 코드 작성
           let amount = 0;
           for (let i = 0; i < price.length; i++) {
            amount += price[i];}
            console.log(amount);
        

        </script>
      </li>

      <li>
        주어진 배열에서 짝수만 출력하시오.
        <script>
          const numbers = [12, 7, 9, 20, 33, 16];
          // 여기에 코드 작성
         // console.log(numbers.length); // 6
          for (let i = 0; i < 6; i++) { 
            //console.log(`i:${i}, numbers[i] :${numbers[i]}`);
            if (numbers[i] % 2 === 0) {
              console.log(numbers[i]);
            }
          }
        </script>
      </li>

      <li>
        주어진 배열에서 가장 큰 값을 찾으시오.
        <script>
          const nums = [3, 45, 21, 99, 18, 77];
          // 여기에 코드 작성
          let max = 0;
          for(const value of nums) 
          {if(max < value){max = value}}
          console.log(max);
          // { 
          //   console.log(`value:${value}`)
          //   if(max < value){
          //     max = value;
          //   }
          //   console.log(`max : ${max}`)
          //   console.log("-----------------")
          // }

        </script>
      </li>

      <li>
        배열을 순회하며 홀수 개수를 세시오.
        <script>
          const values = [1, 4, 7, 8, 13, 20, 21];
          // // 여기에 코드 작성

           let count = 0;
          for(const value of values) {
            if(value % 2 !== 0){
              //console.log(value); 
              count++;
            }
          }
          console.log(count);
          // ++count
          //  console.log(count);
        
          
        </script>
      </li>

      <li>
        배열의 각 요소를 두 배로 만들어 새 배열에 담으시오. (원본 배열은 그대로 두고 새 배열을 만들 것)
        <script>
          const original = [1, 2, 3, 4, 5];
          // 여기에 코드 작성
          let X = []; 
          for(const value of original){
              console.log(value * 2); X.push(value * 2)
          }
          console.log(X)
          
        </script>
      </li>

      <li>
        배열에 push로 값을 하나 추가한 뒤, splice로 특정 값을 하나 삭제하시오.
        <script>
          const fruits = ["사과", "바나나", "포도"];
          // 여기에 코드 작성 (예: "수박" 추가 후 "바나나" 삭제)
          fruits.push('수박');
          fruits.splice(1, 1);
          console.log(fruits);
        </script>
      </li>
    </ol>
  </body>
</html>
