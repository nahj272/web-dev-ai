<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문</title>
</head>
<body>
    <h1>반복문</h1>
    <h6>검사 > console 확인</h6>
    <script>
      // ex) 1 ~ 10까지 출력 console.log(1); X 10번 쓰면 됨
        /* for(초기값;조건식;증감식) {반복문 조건에 해당되는 만큼 실행} */

    for(let i = 1; i <= 10; i++)
    {console. log(i)}
    </script>

    <h2>전위/후위 연산자</h2>
    <script>
        let num = 1;
        num = num + 1;
        console.log(num);
        // num = num + 1 : ++num, num++
        // ++num, --num : 전위 연산자 - 먼저 계산하고 나중에 출력
        // num++, num-- : 후위 연산자 - 먼저 출력하고 나중에 계산con
        console.log(++num); // 결과값 : 3
        console.log(num++); // 결과값 : 3, num값 : 4
        console.log(num); //   결과값 : 4
        console.log(--num); // 결과값 : 3
        console.log(num--); // 결과값 : 3, num값 : 2
         </script>

         <h2>복합대입연산자</h2>
         <script>
             num += 3;    // num = num + 3;과 같은 말
             num -= 2;

             // 30부터 3씩 감소해서 3까지 출력
             for(let i = 30; i > 0; i-=3) {console.log(i);}
         </script>

         <h2>배열과 for문</h2>
         <script>
            const movies = ['오디세이', '옵세션', '스파이더맨: 브랜드 뉴 데이', '더 드라마', '싱 어게인'];
            console.log(movies[0]);
            console.log(movies[1]);
            
             // i < 5 = 배열의 길이와 같음(movies.length;)
            for(let i = 0; i < movies.length; i++)
            {console.log(movies[i])}

            //for (in : for 인덱스 in 배열) {}
            for (let index in movies) {console.log(movies[index]);}
        
            //for (of : for 값 of 배열) {}
            for (const value of movies) {console.log(value);} 
        </script>

        <h2>while문</h2>
        <script>
            /* while(조건) {조건이 true면 계속} */
            // ex) 1 ~ 10까지 출력
        let i = 1;
        while(i <= 10)
        {console. log(i); i++;}


        // 무한 루프 - 일부러 사용(게임 등)
        // while(true) {const input = prompt('종료하려면 q를 입력해주세요')
            // break를 만나면 해당 구문을 빠져나가는 조건을 같이 씀
        //  if(input === 'q') break;}
        </script>

        <h2>break / continue</h2>
        <!-- break 와 continue의 차이
            - break : 반복문을 완전히 빠져나감
            - continue : 해당하는 조건을 건너뛰고 계속 이어짐 --> 

        <script>
        for(let i = 1; i < 9; i++) 
        {if (i === 7) break; 
         if (i === 2) continue; 
          console.log(i);}
        </script>

        <h2>2차원 배열 + 중첩 for문</h2>
        <script>
            // 반복문을 사용해서 1~9
        const arr = 
          [ [1, 2, 3, 4], 
            [5, 6], 
            [7, 8, 9] ];
    console.log(arr[0]); 
    console.log(arr[0][0]);
    console.log(arr[0][1]);

    for(let i = 0; i < arr.length; i++)
    {for (let j = 0; j <arr[i].length; j++)
    {console.log(arr[i][j])}}

    for(const i of arr)
    {for(const j of i) {console.log(j);}}
        </script>


</body>
</html>
