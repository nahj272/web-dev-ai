 <태그></태그> 
 <태그 속성="값">
 -->
<!-- 현재 문서가 html5언어로 작성된 웹 문서 -->
<!DOCTYPE HTML>
<html lang="ko"><!-- 웹 문서의 시작과 끝 -->
    <!-- lang : 문서 언어 지정 (en : 영어, ko : 한국어) -->
    <head>
        <!-- 웹 문서의 정보 -->
        <title>문서 제목</title>

        <!-- 문자 인코딩 UTF-8 설정 -->
        <meta charset="UTF-8">
        <meta name="description" content="문서 설명">
        <meta name="author" content="문서 작성자">
        <!--모바일 화면 설정 
            - width=device-width : 화면 너비에 맞춤
            - initial-scale=1.0 : 초기 확대 비율
            - viewport-fit=cover : 노치(상단 카메라/센서)까지 화면 사용
            -->

        <meta name="viewport", content="width=device-width", initial-scale=1.0, viewport-fit=cover>

        <!-- Open Graph 공유 카드 : 카카오톡 등 링크 공유할 때 미리보기 -->
        <meta property="og:title" content="문서 제목">
        <meta property="og:description" content="문서 설명">
        <meta property="og:image" content="페이지 화면 이미지">
        <meta property="og:url" content="현재 페이지 URL 주소">

        <!-- 파비콘 설정: .ico, .png, .svg -->
        <link rel="icon" href="/01-html-css/assets/favicon.png">

</head>
    <body>
        <!-- 실제  웹 브라우저에 나타나는 내용 -->
         안녕하세요! 오늘 2026년 9월 7일이네요.
         좋은 아침입니다.
    </body>
</html>
