<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>실습 - 폼</title>
  </head>
  <body>
    <h2>넷째바오 100일 잔치 참석 신청서</h2>
    <p>2026년 9월 11일, 에버랜드 판다월드에서 열립니다.</p>
    <form action="" method="post">
      <p>이름 <input type="name" /></p>
      <p>연락처 <input type="tel" placeholder="010-0000-0000" /></p>
      <p>이메일 <input type="email" required /></p>

      <p>
        넷째바오와의 관계
        <select name="national">
          <option disabled selected>선택해주세요</option>
          <option value="family">가족(바오패밀리)</option>
          <option value="friend">친구</option>
          <option value="teacher">선생님</option>
          <option value="fan">팬</option>
        </select>
      </p>

      <fieldset>
        <legend>참석 여부</legend>

        <input type="radio" id="attend" value="attend" />
        <label for="attend">참석</label>

        <label for="">
          <input type="radio" name="attend" value=" do not attend" />불참</label
        >
      </fieldset>

      <fieldset>
        <legend>준비해 올 선물</legend>
        <label
          ><input type="checkbox" name="gift" value="bamboo" /> 대나무
        </label>
        <label
          ><input type="checkbox" name="gift" value="bamboo shoot" /> 죽순
        </label>
        <label><input type="checkbox" name="gift" value="toy" /> 장난감 </label>
        <label
          ><input type="checkbox" name="gift" value="camera" /> 사진기
        </label>
      </fieldset>

      <p>도착 예정 시간 <input type="time" placeholder /></p>
      <p>축하 메시지 <textarea name="memo"></textarea></p>
      <button type="submit">신청하기</button>
    </form>
  </body>
</html>
