<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>표 태그</title>
  </head>
  <body>
    <!-- tr(table row) : 가로 한 줄 -->
    <!--th : 제목칸 (굵게, 가운데)-->
    <!-- td : 일반 데이터칸 -->

    <h2>기본 표</h2>
    <table border="1">
      <tr>
        <th>브라우저</th>
        <th>제조사</th>
      </tr>
      <tr>
        <td>Crome</td>
        <td>구글</td>
      </tr>
      <tr>
        <td>Safari</td>
        <td>애플</td>
      </tr>
    </table>

    <!-- rowspan :  행으로 합치기(세로) -->
    <!--colspan : 열로 합치기(가로)-->

    <h2>행/열 합치기</h2>
    <table border="1">
      <tr>
        <th rowspan="2">이름</th>
        <td>루이바오</td>
      </tr>
      <tr>
        <td>후이바오</td>
      </tr>
      <tr>
        <th colspan="2">주소</th>
      </tr>
      <tr>
        <td colspan="2">경기도 용인 에버랜드</td>
      </tr>
    </table>

    <!-- caption : 표 제목 -->
    <!-- colgroup : 세로 열 묶음 -->
    <!-- thead : 제목줄, tbody : 데이터줄, tfoot : 합계 등 -->
    <!-- tbody는 리액트에서 작성하지 않으면 경고창 -->

    <h2>테이블 구조</h2>
    <table border="1">
      <caption>
        바오 패밀리 친구들
      </caption>
      <colgroup>
        <col />
        <col />
        <col />
      </colgroup>

      <thead>
        <tr>
          <th>이름</th>
          <th>나이</th>
          <th>주소</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>코식이</td>
          <td>36</td>
          <td>경기도 용인</td>
        </tr>

        <tr>
          <td>제돌이</td>
          <td>28</td>
          <td>제주도</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <th colspan="2">총 마리 수</th>
          <td>2</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
